kind = "web"
previewPath = "/"
title = "Cafe Shop"
description = "A warm, welcoming cafe website showcasing the menu, atmosphere, story, location, and visit information for local coffee lovers."
version = "1.0.0"
id = "artifacts/cafe-shop"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24756

[services.development]
run = "pnpm --filter @workspace/cafe-shop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cafe-shop", "run", "build" ]
serve = "static"
publicDir = "artifacts/cafe-shop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24756"
BASE_PATH = "/"
